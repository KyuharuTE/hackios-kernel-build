name: build-kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libssl-dev liblzma-dev zlib1g-dev \
            xz-utils curl ca-certificates python3 python3-pip \
            bsdextrautils dos2unix unzip jq file flex bison m4 autoconf automake libtool
          nproc; free -g | head -2; df -h /

      - name: Install theos (Linux cctools + SDK)
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" || true
          echo '--- toolchain ---'
          ls -l ~/theos/toolchain/linux/*/bin 2>/dev/null | head -5
          if [ ! -d ~/theos/sdks/iPhoneOS16.5.sdk/usr/include ]; then
            echo 'fetching iPhoneOS16.5.sdk from github.com/theos/sdks'
            rm -rf /tmp/sdks-git
            git clone -q --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks-git
            git -C /tmp/sdks-git sparse-checkout set iPhoneOS16.5.sdk
            mkdir -p ~/theos/sdks
            ln -sfn /tmp/sdks-git/iPhoneOS16.5.sdk ~/theos/sdks/iPhoneOS16.5.sdk
          fi
          ls ~/theos/sdks/iPhoneOS16.5.sdk/usr/include | head -3

      - name: Build the kernel
        run: ./build.sh 2>&1 | tee build.log

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          find /workspaces upstream /root /home/runner -name 'hakios-kernel' -o -name 'mach.development.bcm2837' 2>/dev/null | head -20
          for f in $(find /workspaces upstream -name 'hakios-kernel' -o -name 'mach.development.bcm2837' 2>/dev/null); do cp -v "$f" out/ ; done
          ls -l out build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hakios-kernel
          path: |
            out/*
            build.log
          if-no-files-found: warn
          retention-days: 14
