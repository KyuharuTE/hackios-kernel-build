name: build-kernel
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build libssl-dev liblzma-dev zlib1g-dev \
            xz-utils curl ca-certificates python3 python3-pip \
            bsdextrautils dos2unix unzip jq file flex bison m4 autoconf automake libtool uuid-dev libarchive-dev libxml2-dev libbz2-dev gperf texinfo gettext wget netpbm meson ninja-build python3-venv python3-pip pkg-config
          nproc; free -g | head -2; df -h /

      - name: Install theos (Linux cctools + SDK)
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)" || true
          echo '--- toolchain ---'
          ls -l ~/theos/toolchain/linux/*/bin 2>/dev/null | head -5
          if [ ! -d ~/theos/sdks/iPhoneOS16.5.sdk/usr/include ]; then
            echo 'fetching iPhoneOS16.5.sdk from github.com/theos/sdks'
            rm -rf /tmp/sdks-git
            git clone -q --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks-git
            git -C /tmp/sdks-git sparse-checkout set iPhoneOS16.5.sdk
            mkdir -p ~/theos/sdks
            ln -sfn /tmp/sdks-git/iPhoneOS16.5.sdk ~/theos/sdks/iPhoneOS16.5.sdk
          fi
          ls ~/theos/sdks/iPhoneOS16.5.sdk/usr/include | head -3

      - name: Build the kernel
        run: ./build.sh 2>&1 | tee build.log

      - name: Build libredwood.dylib (CA ignore forced off)
        run: |
          cd upstream
          python3 ../patches/ca-ignore.py .
          export THEOS=$HOME/theos
          export PATH="$PWD/xnu-deps/host/bin:$PATH"
          DYN="xnu-clang -arch arm64 -isysroot $THEOS/sdks/iPhoneOS16.5.sdk -O1"
          mkdir -p ../out
          $DYN -dynamiclib -install_name /redwood/lib/libredwood.dylib \
            -framework CoreFoundation -framework IOKit -lobjc \
            -o ../out/libredwood.dylib userland/src/inject.c && ls -l ../out/libredwood.dylib

      - name: Build Mesa + libredwood-gl.dylib (Apple GPU names)
        run: |
          cd upstream
          python3 ../patches/fake-renderer.py .
          pip3 install --quiet mako 2>/dev/null || true
          export THEOS=$HOME/theos
          export PATH="$PWD/xnu-deps/host/bin:$PATH"
          ( cd userland && ../tools/mk-mesa.sh ) 2>&1 | tail -40
          M=$PWD/xnu-deps/build/mesa/out
          ls -l $M/libOSMesa.8.dylib $M/gl.xml $M/exported-gl.txt
          ( cd userland && ./mkeagl.py src/eagl_slots.txt $M/gl.xml $M/exported-gl.txt src/eagl.c > $M/eagl_gen.h )
          DYN="xnu-clang -arch arm64 -isysroot $THEOS/sdks/iPhoneOS16.5.sdk -O1"
          mkdir -p ../out
          $DYN -dynamiclib -install_name /redwood/lib/libredwood-gl.dylib -I$M \
            -framework CoreFoundation -framework IOKit -framework IOSurface -lobjc \
            $M/libOSMesa.8.dylib -o ../out/libredwood-gl.dylib \
            userland/src/eagl.c userland/src/gl_osmesa.c && ls -l ../out/libredwood-gl.dylib

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          cp -v upstream/built/* out/ 2>/dev/null || true
          cp -v full-build.log out/ 2>/dev/null || true
          [ -s build.log ] && cp build.log out/ || true
          ls -l out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hakios-kernel
          path: |
            out/*
            build.log
          if-no-files-found: warn
          retention-days: 14
